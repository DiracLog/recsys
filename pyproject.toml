
[project]
name = "movie-recommendation-system"
version = "0.1.0"
description = "recommendation tool with hybrid options(SVD + cos. sim.)"
authors = [
    {name = "mkorolchuk",email = "swisswhiskey666@gmail.com"}]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "python-dotenv>=1.2.2",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pyarrow>=24.0.0",
    "psutil>=7.2.2",
    "uvicorn>=0.46.0",
    "pympler>=1.1",
    "polars>=1.40.1",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest (>=8.0.3,<10.0.0)",
    "ruff (>=0.12.10,<0.16.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)"
]

api = [
    "fastapi (>=0.110.0,<1.0.0)",
    "uvicorn[standard] (>=0.29.0,<1.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.uv]
package=true

[project.scripts]
serve = "src.api.run:main"
serve-test = "src.api.run_test:main"
